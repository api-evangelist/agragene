  description: >-
    An anonymous remote Model Context Protocol endpoint served on Agragene's own host and
    advertised in the company's llms.txt. Nine tools let an agent read business details,
    search site content, mint a visitor session token, and browse Wix API documentation.
    The server is the stock Wix Site MCP implementation — platform-authored, enabled by
    Agragene — and is the only callable API surface the company publishes.
