aid: agragene
name: Agragene
description: >-
  Agragene is an agricultural biotechnology company using CRISPR-based genome engineering
  to build Precision-Guided Sterile Insect Technology (pgSIT), a modern evolution of the
  sterile insect technique that breeds insect lines producing only sterile males. Released
  into a field, those males mate with wild female crop pests and produce no viable
  offspring, giving growers season-long local pest suppression without chemical pesticides
  or irradiation. Founded in San Diego in 2017 and now headquartered in St. Louis,
  Missouri, the company's first product, KNOCKOUT-SWD, targets Spotted Wing Drosophila —
  a pest behind more than $500M in annual US berry losses — with a limited launch stated
  for 2027. Agragene has no developer program and publishes no API product; its only
  machine-readable surface is an anonymous Wix site MCP endpoint plus a company-authored
  llms.txt.
