description: Agragene serves a live, unauthenticated remote MCP endpoint at https://www.agragene.com/_api/mcp,
  advertised in the company's own /llms.txt under an "AI Agent Access" section. An anonymous JSON-RPC
  initialize returned serverInfo.name 'Site Visitor Assistant for site "Agragene"' and tools/list returned
  9 tools with full inputSchemas. This is the ONLY machine-readable API surface Agragene publishes — the
  company is a pre-commercial agricultural-biotechnology firm with no developer program, no OpenAPI, and
  no public product API.
authorship: platform
authorship_note: This is the stock Wix Site MCP server, not a server Agragene wrote. The tool set (GetBusinessDetails,
  SearchInSite, SearchSiteApiDocs, GenerateVisitorToken, CallWixSiteAPI, ExecuteWixAPI, ReadFullDocsArticle,
  ReadFullDocsMethodSchema, BrowseWixRESTDocsMenu) is byte-identical across Wix tenants and is documented
  at https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp. Agragene's
  contribution is enabling it on its own host; the surface is real and reachable, but it is a platform
  affordance, not provider-authored API design.
