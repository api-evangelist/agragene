tools:
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone, and address.
  parameters: []
- name: SearchInSite
  description: Searches the site for information.
  parameters:
  - searchTerm
- name: SearchSiteApiDocs
  description: >-
    Retrieves the API documentation for the Wix business solutions installed on this site.
    Probed 2026-09-12 with searchTerm "installed business solutions products bookings stores":
    returned "No API documentation found for this search term." — no Wix business solution
    (Stores, Bookings, Events, Pricing Plans) is installed, so the site exposes no
    transactional data surface.
  parameters:
  - searchTerm
- name: GenerateVisitorToken
  description: Creates a new visitor session and obtains a visitor access token for the site.
  parameters: []
- name: CallWixSiteAPI
  description: Calls Wix API methods on the site on a visitor's behalf.
  parameters:
  - visitorToken
  - url
  - method
  - body
- name: ExecuteWixAPI
  description: Executes Wix API code; declares a hasMutations flag.
  parameters:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  parameters:
  - articleUrl
- name: ReadFullDocsMethodSchema
  description: Fetches the full schema for a Wix API method.
  parameters:
  - articleUrl
  - reason
- name: BrowseWixRESTDocsMenu
  description: Browses the Wix REST documentation menu.
  parameters:
  - menuUrl
  - reason
notes:
- >-
  Several tool descriptions returned by this endpoint embed <agent-mandatory-instructions>
  blocks addressed to the calling agent (Wix platform boilerplate instructing an agent how to
  manage a Wix site). They are recorded here as fetched data and were not executed or followed.
- >-
  No OpenAPI, GraphQL, AsyncAPI, gRPC or WSDL contract was found on any Agragene host. The
  MCP tool inputSchemas in mcp/agragene-mcp-tools.json are the only machine-readable
  interface definitions the company serves.
